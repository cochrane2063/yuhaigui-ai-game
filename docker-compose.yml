services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: 2YWZAfK7
      MARIADB_DATABASE: haigui
      MARIADB_USER: haigui
      MARIADB_PASSWORD: fJL7Uo5D
    volumes:
      - ./db_data:/var/lib/mysql
      - ./haigui.sql:/docker-entrypoint-initdb.d/init.sql
  backend:
    image: haigui-beckend:latest
    container_name: haigui-backend
    environment:
      BACKEND_PORT: 8080 #Optional, default is 8080
      FRONTEND_URL: http://localhost:4173
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_NAME: haigui
      DATABASE_USERNAME: haigui
      DATABASE_PASSWORD: fJL7Uo5D
      JWT_SECRET: <Your JWT Secret>
      AI_API_KEY: <Your AI API Key>
      AI_BASE_URL: <Base URL>
      AI_MODEL: <AI Model>
    ports:
      - "8080:8080"
    links:
      - db
    depends_on:
      - db